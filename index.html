<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FADE&CO — Barber Management System</title>
<meta name="description" content="Sistem Manajemen BarberShop — reservasi, ulasan, dan dasbor admin.">

<!-- ============================================================
     FADE&CO Barber Management System — Standalone HTML Demo
     One file, no server. Data tersimpan di localStorage browser.
     Tema: hitam transparan (glass) + kuning emas.
     ============================================================ -->

<style>
:root{
  --bg:oklch(0.16 0.006 70);--fg:oklch(0.97 0.01 80);
  --card:oklch(0.21 0.008 70 / 0.72);--border:oklch(0.3 0.02 75 / 0.55);
  --muted:oklch(0.72 0.02 80);--primary:oklch(0.88 0.17 90);--primary-fg:oklch(0.18 0.02 70);
  --emerald:oklch(0.7 0.15 145);--rose:oklch(0.65 0.2 25);
  --amber-t:amber-300;--font:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --r:0.85rem;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;max-width:100vw}
.bg-grid{position:fixed;inset:0;z-index:-2;
  background-image:linear-gradient(to right,oklch(0.3 0.02 75 / 0.07) 1px,transparent 1px),linear-gradient(to bottom,oklch(0.3 0.02 75 / 0.07) 1px,transparent 1px);
  background-size:44px 44px}
.bg-glow{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 18% 0%,oklch(0.85 0.17 90 / 0.16),transparent 42%),radial-gradient(circle at 82% 8%,oklch(0.7 0.15 60 / 0.1),transparent 38%)}
.glass{background:var(--card);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--border);border-radius:calc(var(--r)+6px)}
.container{max-width:1200px;width:100%;margin:0 auto;padding:0 1rem;min-width:0}
@media(min-width:640px){.container{padding:0 1.5rem}}
@media(min-width:1024px){.container{padding:0 2rem}}
.font-display{font-family:var(--font);font-weight:700;letter-spacing:-0.01em}

/* Layout shell */
.app{display:flex;flex-direction:column;min-height:100vh;min-width:0;max-width:100vw;overflow-x:hidden}
header.nav{position:sticky;top:0;z-index:40;border-bottom:1px solid var(--border);background:oklch(0.16 0.006 70 / 0.6);backdrop-filter:blur(20px)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:4rem}
.brand{display:flex;align-items:center;gap:0.625rem}
.brand-logo{width:2.25rem;height:2.25rem;border-radius:0.75rem;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;font-size:1.1rem;font-weight:800;box-shadow:0 0 24px -6px var(--primary)}
.brand-name{font-size:1.1rem;font-weight:700;letter-spacing:-0.01em}
.brand-name b{color:var(--primary)}
.brand-sub{font-size:0.625rem;font-weight:500;text-transform:uppercase;letter-spacing:0.22em;color:var(--muted)}
.nav-links{display:none;gap:1.75rem;font-size:0.875rem;color:var(--muted)}
@media(min-width:768px){.nav-links{display:flex}}
.nav-links a{color:inherit;text-decoration:none;transition:color .15s}
.nav-links a:hover{color:var(--fg)}
.nav-actions{display:flex;gap:0.5rem;align-items:center}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;white-space:nowrap;border-radius:0.5rem;font-size:0.875rem;font-weight:500;padding:0.5rem 1rem;border:1px solid transparent;cursor:pointer;transition:all .15s;outline:none;font-family:inherit}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-default{background:var(--primary);color:var(--primary-fg)}
.btn-default:hover{background:oklch(0.85 0.17 90 / 0.9)}
.btn-outline{background:transparent;border-color:var(--border);color:var(--fg)}
.btn-outline:hover{background:oklch(0.3 0.02 75 / 0.3)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--fg);background:oklch(0.3 0.02 75 / 0.3)}
.btn-lg{height:3rem;padding:0 1.75rem;font-size:1rem}
.btn-sm{height:2rem;padding:0 0.75rem;font-size:0.8rem}
.btn-icon{width:2rem;height:2rem;padding:0}
.btn svg{width:1rem;height:1rem;flex-shrink:0}

/* Badge / pill */
.badge{display:inline-flex;align-items:center;gap:0.375rem;border-radius:9999px;padding:0.125rem 0.625rem;font-size:0.6875rem;font-weight:600;border:1px solid transparent}
.pill-avail{background:oklch(0.7 0.15 145 / 0.15);color:oklch(0.8 0.15 145);border-color:oklch(0.7 0.15 145 / 0.3)}
.pill-booked{background:oklch(0.65 0.2 25 / 0.15);color:oklch(0.8 0.2 25);border-color:oklch(0.65 0.2 25 / 0.3)}
.pill-primary{background:oklch(0.88 0.17 90 / 0.15);color:var(--primary);border-color:oklch(0.88 0.17 90 / 0.3)}
.dot{width:0.375rem;height:0.375rem;border-radius:9999px;display:inline-block}
.dot-green{background:#4ade80}.dot-red{background:#f87171}
.pulse{position:relative}
.pulse::after{content:'';position:absolute;inset:0;border-radius:inherit;background:inherit;animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{75%,100%{transform:scale(2.2);opacity:0}}

/* Hero */
.hero{padding:4rem 0}
@media(min-width:640px){.hero{padding:6rem 0}}
.hero-badge{display:inline-flex;align-items:center;gap:0.375rem;border:1px solid oklch(0.88 0.17 90 / 0.3);background:oklch(0.88 0.17 90 / 0.1);color:var(--primary);padding:0.25rem 0.625rem;border-radius:9999px;font-size:0.75rem;margin-bottom:1.25rem}
.hero h1{font-size:3rem;font-weight:700;line-height:1.05;letter-spacing:-0.02em}
@media(min-width:640px){.hero h1{font-size:3.75rem}}
@media(min-width:1024px){.hero h1{font-size:4.5rem}}
.hero h1 .grad{background:linear-gradient(90deg,var(--primary),#fcd34d,var(--primary));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:1.5rem;max-width:36rem;font-size:1.0625rem;color:var(--muted)}
.hero-actions{margin-top:2rem;display:flex;flex-wrap:wrap;gap:0.75rem}
.hero-stats{margin-top:3rem;display:grid;grid-template-columns:repeat(2,1fr);gap:0.75rem;max-width:42rem}
@media(min-width:640px){.hero-stats{grid-template-columns:repeat(4,1fr)}}
.stat{display:flex;align-items:center;gap:0.75rem;padding:0.75rem 1rem}
.stat-ico{width:2.25rem;height:2.25rem;border-radius:0.5rem;display:grid;place-items:center;background:oklch(0.88 0.17 90 / 0.15);color:var(--primary);flex-shrink:0}
.stat-ico.accent{background:var(--primary);color:var(--primary-fg)}
.stat-val{font-size:1.125rem;font-weight:700;line-height:1}
.stat-lbl{font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-top:0.125rem}

/* Marquee */
.marquee{overflow:hidden;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:oklch(0.21 0.008 70 / 0.3);padding:0.75rem 0;width:100%;max-width:100%;position:relative;contain:layout style paint}
.marquee-track{display:flex;width:max-content;gap:2rem;animation:marquee 28s linear infinite;padding-left:1rem}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.marquee-item{display:flex;align-items:center;gap:0.75rem;font-size:0.875rem;font-weight:500;text-transform:uppercase;letter-spacing:0.18em;color:var(--muted);white-space:nowrap}
.marquee-item svg{color:var(--primary);width:0.875rem;height:0.875rem}

/* Section heading */
.section{padding:4rem 0;scroll-margin-top:5rem}
.section-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:0.75rem;margin-bottom:2rem}
.section-eyebrow{display:flex;align-items:center;gap:0.5rem;font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.15em;color:var(--primary);margin-bottom:0.5rem}
.section-eyebrow svg{width:0.875rem;height:0.875rem}
.section-title{font-size:1.875rem;font-weight:700;letter-spacing:-0.02em}
@media(min-width:640px){.section-title{font-size:2.25rem}}
.section-desc{margin-top:0.5rem;font-size:0.875rem;color:var(--muted)}

/* Barber grid */
.grid-barbers{display:grid;grid-template-columns:1fr;gap:1.25rem}
@media(min-width:640px){.grid-barbers{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid-barbers{grid-template-columns:repeat(3,1fr)}}
.barber-card{padding:1.25rem;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.barber-card:hover{transform:translateY(-4px);box-shadow:0 0 0 1px oklch(0.88 0.17 90 / 0.3)}
.barber-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative}
.barber-id-block{display:flex;align-items:center;gap:0.75rem;cursor:pointer;background:none;border:none;color:inherit;text-align:left;font-family:inherit;padding:0}
.barber-avatar{width:3rem;height:3rem;border-radius:0.75rem;display:grid;place-items:center;font-weight:700;font-size:0.9375rem}
.av-amber{background:linear-gradient(135deg,oklch(0.7 0.15 60 / 0.3),oklch(0.55 0.12 60 / 0.1));color:#fcd34d}
.av-rose{background:linear-gradient(135deg,oklch(0.7 0.18 15 / 0.3),oklch(0.55 0.15 15 / 0.1));color:#fda4af}
.av-emerald{background:linear-gradient(135deg,oklch(0.7 0.15 145 / 0.3),oklch(0.55 0.12 145 / 0.1));color:#6ee7b7}
.av-sky{background:linear-gradient(135deg,oklch(0.7 0.15 230 / 0.3),oklch(0.55 0.12 230 / 0.1));color:#7dd3fc}
.av-violet{background:linear-gradient(135deg,oklch(0.7 0.15 300 / 0.3),oklch(0.55 0.12 300 / 0.1));color:#c4b5fd}
.barber-num{font-size:0.625rem;font-weight:700;color:var(--muted)}
.barber-name{font-weight:600;font-size:1rem;line-height:1.1}
.barber-type{font-size:0.75rem;font-weight:500}
.t-master{color:#fcd34d}.t-senior{color:#6ee7b7}.t-junior{color:#7dd3fc}
.barber-rating{display:flex;align-items:center;gap:0.25rem;margin-top:0.125rem;font-size:0.6875rem}
.barber-rating svg{width:0.75rem;height:0.75rem;fill:var(--primary);color:var(--primary)}
.barber-rating .count{color:var(--muted)}
.barber-bottom{display:flex;align-items:flex-end;justify-content:space-between;margin-top:1.25rem;position:relative}
.tarif-lbl{font-size:0.625rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted)}
.tarif-val{font-size:1.5rem;font-weight:700;color:var(--primary)}
.see-reviews{margin-top:0.25rem;font-size:0.6875rem;color:var(--muted);background:none;border:none;cursor:pointer;text-align:left;padding:0;font-family:inherit;text-decoration:underline;text-underline-offset:2px}
.see-reviews:hover{color:var(--primary)}

/* How it works */
.how-grid{display:grid;grid-template-columns:1fr;gap:1.25rem}
@media(min-width:768px){.how-grid{grid-template-columns:repeat(3,1fr)}}
.how-card{padding:1.5rem;position:relative;overflow:hidden}
.how-step{position:absolute;right:-0.5rem;top:-0.5rem;font-size:4.5rem;font-weight:700;color:oklch(0.88 0.17 90 / 0.1);line-height:1}
.how-ico{width:2.75rem;height:2.75rem;border-radius:0.75rem;display:grid;place-items:center;background:oklch(0.88 0.17 90 / 0.15);color:var(--primary);margin-bottom:1rem}
.how-ico svg{width:1.25rem;height:1.25rem}
.how-title{font-weight:600;font-size:1.125rem;margin-bottom:0.375rem}
.how-desc{font-size:0.875rem;color:var(--muted)}

/* Pricing */
.price-grid{display:grid;grid-template-columns:1fr;gap:0.75rem}
@media(min-width:640px){.price-grid{grid-template-columns:repeat(3,1fr)}}
.price-card{padding:1.5rem;position:relative;display:flex;flex-direction:column}
.price-card.featured{box-shadow:0 0 0 1px oklch(0.88 0.17 90 / 0.4)}
.price-pop{position:absolute;top:-0.75rem;left:1.5rem;background:var(--primary);color:var(--primary-fg);font-size:0.6875rem;padding:0.125rem 0.5rem;border-radius:0.375rem;font-weight:600}
.price-tier{font-size:0.875rem;font-weight:600}
.price-val{font-size:1.875rem;font-weight:700;margin-top:0.25rem}
.price-desc{font-size:0.875rem;color:var(--muted);margin-top:0.25rem}
.price-features{margin-top:1.25rem;list-style:none;display:flex;flex-direction:column;gap:0.625rem;font-size:0.875rem}
.price-features li{display:flex;align-items:center;gap:0.5rem}
.price-features svg{width:1rem;height:1rem;color:var(--primary);flex-shrink:0}

/* Testimonial */
.testimonial{padding:2rem;position:relative;overflow:hidden}
@media(min-width:640px){.testimonial{padding:3rem}}
.testimonial .quote-ico{position:absolute;left:-0.5rem;top:-0.5rem;width:6rem;height:6rem;color:oklch(0.88 0.17 90 / 0.1)}
.testimonial .stars{display:flex;gap:0.125rem;margin-bottom:0.75rem}
.testimonial .stars svg{width:1rem;height:1rem;fill:var(--primary);color:var(--primary)}
.testimonial p{font-size:1.25rem;font-weight:500;line-height:1.5;max-width:42rem}
@media(min-width:640px){.testimonial p{font-size:1.5rem}}
.testimonial-author{display:flex;align-items:center;gap:0.75rem;margin-top:1.25rem}
.testimonial-avatar{width:2.5rem;height:2.5rem;border-radius:9999px;background:oklch(0.88 0.17 90 / 0.2);display:grid;place-items:center;font-weight:700;color:var(--primary)}
.testimonial-name{font-size:0.875rem;font-weight:600}
.testimonial-meta{font-size:0.75rem;color:var(--muted)}

/* Lookup section */
.lookup{padding:2rem;position:relative;overflow:hidden}
@media(min-width:640px){.lookup{padding:2.5rem}}
.lookup .glow{position:absolute;right:-2.5rem;top:-2.5rem;width:10rem;height:10rem;border-radius:9999px;background:oklch(0.88 0.17 90 / 0.15);filter:blur(3rem);pointer-events:none}
.lookup-form{margin-top:1.5rem;display:flex;flex-direction:column;gap:0.5rem}
@media(min-width:640px){.lookup-form{flex-direction:row}}
.lookup-input-wrap{position:relative;flex:1}
.lookup-input-wrap svg{position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);width:1rem;height:1rem;color:var(--muted)}
.lookup-input{width:100%;height:2.5rem;padding:0 0.75rem 0 2.25rem;background:var(--card);border:1px solid var(--border);border-radius:0.5rem;color:var(--fg);font-family:inherit;font-size:0.875rem;outline:none}
.lookup-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px oklch(0.88 0.17 90 / 0.2)}
.lookup-result{margin-top:1.25rem;border:1px solid var(--border);border-radius:1rem;overflow:hidden;background:oklch(0.21 0.008 70 / 0.4)}
.lookup-head{display:flex;align-items:center;justify-content:space-between;gap:0.75rem;padding:1rem;border-bottom:1px solid var(--border);flex-wrap:wrap}
.lookup-id{font-family:monospace;font-size:1.125rem;font-weight:700;color:var(--primary)}
.lookup-grid{display:grid;grid-template-columns:1fr;gap:0.75rem;padding:1rem}
@media(min-width:640px){.lookup-grid{grid-template-columns:repeat(2,1fr)}}
.lookup-field{padding:0.625rem 0.75rem;border:1px solid var(--border);border-radius:0.5rem;background:oklch(0.16 0.006 70 / 0.3)}
.lookup-field-lbl{display:flex;align-items:center;gap:0.375rem;font-size:0.625rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted)}
.lookup-field-lbl svg{width:0.875rem;height:0.875rem}
.lookup-field-val{margin-top:0.125rem;font-size:0.875rem;font-weight:500}
.lookup-foot{display:flex;align-items:center;justify-content:space-between;gap:0.5rem;padding:1rem;border-top:1px solid var(--border);background:oklch(0.16 0.006 70 / 0.3);flex-wrap:wrap}
.lookup-foot small{font-size:0.6875rem;color:var(--muted)}

/* Footer */
footer{margin-top:auto;border-top:1px solid var(--border);background:oklch(0.21 0.008 70 / 0.3);backdrop-filter:blur(10px)}
.footer-inner{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:1rem;padding:2rem 0}
@media(min-width:640px){.footer-inner{flex-direction:row}}
.footer-meta{display:flex;gap:1rem;font-size:0.75rem;color:var(--muted);flex-wrap:wrap;justify-content:center}
.footer-meta span{display:flex;align-items:center;gap:0.375rem}
.footer-meta svg{width:0.875rem;height:0.875rem}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:oklch(0 0 0 / 0.7);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:1rem;max-width:28rem;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5)}
.modal-hero{padding:1.5rem 1.5rem 1rem;background:linear-gradient(135deg,oklch(0.88 0.17 90 / 0.15),transparent);border-bottom:1px solid var(--border)}
.modal-head{display:flex;align-items:center;gap:0.75rem}
.modal-ico{width:2.75rem;height:2.75rem;border-radius:0.75rem;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;flex-shrink:0}
.modal-ico svg{width:1.25rem;height:1.25rem}
.modal-title{font-size:1.25rem;font-weight:700}
.modal-sub{font-size:0.75rem;color:var(--muted)}
.modal-body{padding:1.5rem}
.modal-foot{display:flex;gap:0.5rem;padding:0 1.5rem 1.5rem;justify-content:space-between;flex-wrap:wrap}
.modal-close{position:absolute;top:0.75rem;right:0.75rem;width:2rem;height:2rem;border-radius:0.5rem;background:transparent;border:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.modal-close:hover{color:var(--fg);background:oklch(0.3 0.02 75 / 0.3)}
.modal-close svg{width:1rem;height:1rem}
.modal{position:relative}

/* Form */
.field{margin-bottom:1rem}
.field-grid{display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:640px){.field-grid{grid-template-columns:1fr 1fr}}
.field label{display:block;font-size:0.75rem;color:var(--muted);margin-bottom:0.375rem;font-weight:500}
.field label.icon-lbl{display:flex;align-items:center;gap:0.375rem}
.field label svg{width:0.875rem;height:0.875rem}
.field input,.field textarea,.field select{width:100%;background:oklch(0.16 0.006 70 / 0.5);border:1px solid var(--border);border-radius:0.5rem;color:var(--fg);font-family:inherit;font-size:0.875rem;padding:0.5rem 0.75rem;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px oklch(0.88 0.17 90 / 0.2)}
.field textarea{resize:vertical;min-height:4.5rem}
.field .hint{font-size:0.6875rem;color:var(--muted);margin-top:0.25rem;text-align:right}

/* Booking context box */
.ctx-box{margin-bottom:1rem;border:1px solid var(--border);border-radius:0.75rem;background:oklch(0.21 0.008 70 / 0.4);padding:0.75rem;font-size:0.875rem}
.ctx-row{display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
.ctx-id{font-family:monospace;font-size:0.75rem;font-weight:600;color:var(--primary)}

/* Star picker */
.stars-picker{display:flex;gap:0.25rem;align-items:center}
.stars-picker button{background:none;border:none;padding:0.25rem;cursor:pointer;border-radius:0.375rem;transition:transform .1s}
.stars-picker button:hover{transform:scale(1.15)}
.stars-picker svg{width:2rem;height:2rem;transition:color .15s,fill .15s}
.stars-picker svg.empty{color:oklch(0.5 0 0 / 0.4);fill:transparent}
.stars-picker svg.filled{color:var(--primary);fill:var(--primary)}
.stars-picker .rating-val{margin-left:0.5rem;font-weight:700;color:var(--primary);font-size:0.875rem}

/* Review list */
.reviews-list{margin-top:0.5rem;max-height:48vh;overflow-y:auto;padding-right:0.25rem}
.review-item{border:1px solid var(--border);border-radius:0.75rem;background:oklch(0.21 0.008 70 / 0.4);padding:0.75rem;margin-bottom:0.5rem}
.review-top{display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
.review-author{display:flex;align-items:center;gap:0.5rem}
.review-avatar{width:2rem;height:2rem;border-radius:9999px;background:oklch(0.88 0.17 90 / 0.15);display:grid;place-items:center;font-size:0.75rem;font-weight:700;color:var(--primary)}
.review-name{font-size:0.875rem;font-weight:600}
.review-date{font-size:0.6875rem;color:var(--muted)}
.review-stars{display:flex;gap:0.125rem}
.review-stars svg{width:0.875rem;height:0.875rem;fill:var(--primary);color:var(--primary)}
.review-comment{margin-top:0.5rem;font-size:0.875rem;color:oklch(0.97 0.01 80 / 0.9);line-height:1.5}

/* Toast */

  try {

    bookings: SEED_BOOKINGS,
    reviews: SEED_REVIEWS,

  return name.split(" ").slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
}
function formatIDR(v) {
  return new Intl.NumberFormat("id-ID", {style:"currency",currency:"IDR",minimumFractionDigits:0,maximumFractionDigits:0}).format(v);
}
function formatSchedule(ts) {
  const d = new Date(ts);
  return new Intl.DateTimeFormat("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}).format(d);
}
function genId(prefix = "BMS-") {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  for (let i = 0; i < 6; i++) out += chars[Math.floor(Math.random()*chars.length)];
  return prefix + out;
}
function tierClass(type) {
  if (type === "Master Barber") return "t-master";
  if (type === "Senior Barber") return "t-senior";
  return "t-junior";
}
function tierLabel(type) {
  return type.replace(" Barber", "");
}
function avatarClass(color) {
  return "av-" + (color || "amber");
}
function avgRating(barberId) {
  const rs = state.reviews.filter(r => r.barbermanId === barberId);
  if (rs.length === 0) return {avg:0, count:0};
  const sum = rs.reduce((s, r) => s + r.rating, 0);
  return {avg: Math.round((sum/rs.length)*10)/10, count: rs.length};
}
function globalRating() {
  if (state.reviews.length === 0) return {avg:0, total:0};
  const sum = state.reviews.reduce((s,r)=>s+r.rating,0);
  return {avg: Math.round((sum/state.reviews.length)*10)/10, total: state.reviews.length};
}
function stats() {
  const confirmed = state.bookings.filter(b => b.status === "Confirmed");
  const revenue = confirmed.reduce((s,b)=>s+b.totalCost,0);
  return {
    totalBookings: state.bookings.length,
    confirmed: confirmed.length,
    canceled: state.bookings.filter(b => b.status === "Canceled").length,
    totalBarbers: state.barbers.length,
    availableBarbers: state.barbers.filter(b => b.status === "Available").length,
    revenue,
  };

// ---- Toast ----
function toast(msg, type = "success") {
  const root = document.getElementById("toast-root");
  const el = document.createElement("div");
  el.className = "toast toast-" + type;
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => {
    el.style.transition = "opacity .3s, transform .3s";
    el.style.opacity = "0";
    el.style.transform = "translateY(-10px)";
    setTimeout(() => el.remove(), 300);

let view = "public"; // "public" | "admin" | "admin-gate"
let adminSection = "overview";
let adminAuthed = false;
// Modal state
let modal = null; // {type, data}

function openModal(type, data = {}) {
  modal = { type, data };
  renderModal();
}
function closeModal() {
  modal = null;
  renderModal();
}

function render() {
  const app = document.getElementById("app");
  if (view === "admin-gate") {
    app.innerHTML = renderAdminGate();
    return;
  }
  if (view === "admin" && !adminAuthed) {
    app.innerHTML = renderAdminGate();
    return;
  }
  if (view === "admin") {
    app.innerHTML = renderAdmin();
    bindAdmin();
    return;
  }
  app.innerHTML = renderPublic();
  bindPublic();
}

function renderModal() {
  const root = document.getElementById("modal-root");
  if (!modal) { root.innerHTML = ""; return; }
  const overlay = `<div class="modal-overlay open" onclick="if(event.target===this)closeModal()">`;
  let content = "";
  if (modal.type === "book") content = renderBookModal(modal.data);
  else if (modal.type === "barberDetail") content = renderBarberDetailModal(modal.data);
  else if (modal.type === "review") content = renderReviewModal(modal.data);
  else if (modal.type === "bookingDetail") content = renderBookingDetailModal(modal.data);
  else if (modal.type === "addBarber") content = renderAddBarberModal(modal.data);
  else if (modal.type === "confirmDelete") content = renderConfirmDeleteModal(modal.data);
  else if (modal.type === "login") content = renderLoginModal(modal.data);
  root.innerHTML = overlay + content + "</div>";
  bindModal();
}

function submitBook(barberId){
  const name=document.getElementById("bk-name").value.trim();
  const phone=document.getElementById("bk-phone").value.trim();
  const email=document.getElementById("bk-email").value.trim();
  const schedule=document.getElementById("bk-schedule").value;
  const notes=document.getElementById("bk-notes").value.trim();
  if(!name||!phone||!email||!schedule){toast("Lengkapi semua data","error");return;}
  const barber=state.barbers.find(b=>b.id===barberId);
  if(!barber){toast("Barberman tidak ditemukan","error");return;}
  if(barber.status==="Booked"){toast("Barberman sudah dibooking","error");return;}
  // find or create guest
  let guest=state.guests.find(g=>g.email.toLowerCase()===email.toLowerCase());
  if(!guest){
    guest={id:"g"+Date.now(),name,email,phone,createdAt:Date.now()};
    state.guests.push(guest);
  } else { guest.name=name; guest.phone=phone; }
  // unique reservation id
  let rid=genId();
  while(state.bookings.some(b=>b.reservationId===rid)) rid=genId();
  const booking={
    id:"bk"+Date.now(),reservationId:rid,guestId:guest.id,barbermanId:barber.id,
    totalCost:barber.price,status:"Confirmed",schedule:new Date(schedule).getTime(),
    notes:notes||null,createdAt:Date.now()
  };
  state.bookings.push(booking);
  barber.status="Booked";
  saveState();
  toast("Reservasi berhasil! ID: "+rid,"success");
  closeModal();
  render();
}

/* ============ LOOKUP ============ */
function doLookup(){
  const id=document.getElementById("lookupInput").value.trim().toUpperCase();
  const out=document.getElementById("lookupResult");
  if(!id){out.innerHTML="";return;}
  const b=state.bookings.find(b=>b.reservationId===id);
  if(!b){
    out.innerHTML=`<div class="lookup-result" style="border-color:oklch(0.65 0.2 25 / 0.3);background:oklch(0.65 0.2 25 / 0.05)">
      <div style="display:flex;align-items:center;gap:0.75rem;padding:1rem;color:oklch(0.8 0.2 25);font-size:0.875rem">
        ${I.xCircle}ID reservasi tidak ditemukan. Periksa kembali penulisannya.
      </div></div>`;
    return;
  }
  const barber=state.barbers.find(x=>x.id===b.barbermanId);
  const guest=state.guests.find(g=>g.id===b.guestId);
  const confirmed=b.status==="Confirmed";
  const hasReview=state.reviews.some(r=>r.bookingId===b.id);
  const guestName=guest?(()=>{const p=guest.name.split(" ");return p.length===1?p[0]:`${p[0]} ${p[p.length-1][0]}.`;})():"—";
  out.innerHTML=`<div class="lookup-result">
    <div class="lookup-head">
      <div>
        <div class="tarif-lbl">ID Reservasi</div>
        <div class="lookup-id">${b.reservationId}</div>
      </div>
      <span class="badge ${confirmed?'pill-avail':'pill-booked'}">${confirmed?I.checkCircle:I.xCircle}${b.status}</span>
    </div>
    <div class="lookup-grid">
      <div class="lookup-field"><div class="lookup-field-lbl">${I.user}Pelanggan</div><div class="lookup-field-val">${guestName}</div></div>
      <div class="lookup-field"><div class="lookup-field-lbl">${I.scissors}Barberman</div><div class="lookup-field-val">${barber?.name||"—"} <span class="cell-sub">· ${barber?.type||"—"}</span></div></div>
      <div class="lookup-field"><div class="lookup-field-lbl">${I.calendarClock}Jadwal</div><div class="lookup-field-val">${formatSchedule(b.schedule)}</div></div>
      <div class="lookup-field"><div class="lookup-field-lbl">${I.star}Total Biaya</div><div class="lookup-field-val" style="color:var(--primary);font-weight:600">${formatIDR(b.totalCost)}</div></div>
    </div>
    <div class="lookup-foot">
      <small>Dibuat ${formatSchedule(b.createdAt)}</small>
      ${confirmed?`<button class="btn btn-sm ${hasReview?'btn-outline':'btn-default'}" ${hasReview?'disabled':''} onclick="openReview('${b.id}')">${hasReview?I.star+"Sudah Dinilai":I.star+"Beri Penilaian"}</button>`:""}
    </div>
  </div>`;
}

function openReview(bookingId){

  const barber=state.barbers.find(x=>x.id===b.barbermanId);

}
function renderReviewModal(d){
  const b=d.booking; const barber=d.barber;
  return `<div class="modal">
    <button class="modal-close" onclick="closeModal()">${I.xCircle}</button>
    <div class="modal-hero">

        </div>
      </div>
      <div class="ctx-box">
        <div class="ctx-row"><span class="ctx-id">${b.reservationId}</span><span class="cell-sub">${formatSchedule(b.schedule)}</span></div>
        <div style="display:flex;justify-content:space-between;margin-top:0.375rem"><span class="cell-main">${barber.name}</span><span class="cell-price">${formatIDR(b.totalCost)}</span></div>

          ${[1,2,3,4,5].map(n=>`<button type="button" onclick="setRating(${n})" data-n="${n}"><span class="empty">${I.star}</span></button>`).join("")}
          <span class="rating-val" id="ratingVal"></span>
        </div>
      </div>
      <div class="field">
        <label class="icon-lbl">${I.messageSquare}Komentar (opsional)</label>

      </div>
      <div class="modal-foot" style="padding:0">

        <button type="submit" class="btn btn-default" style="min-width:10rem">${I.send}Kirim Ulasan</button>
      </div>
    </form>
  </div>`;
}
let currentRating=0;
function setRating(n){
  currentRating=n;
  document.querySelectorAll("#starsPicker button").forEach(btn=>{
    const nn=+btn.dataset.n;
    btn.innerHTML = nn<=n ? `<span class="filled">${I.star}</span>` : `<span class="empty">${I.star}</span>`;
  });
  document.getElementById("ratingVal").textContent=n+".0";
}
function submitReview(bookingId){
  if(currentRating<1){toast("Pilih jumlah bintang dulu ya","error");return;}
  const b=state.bookings.find(x=>x.id===bookingId);
  if(!b){toast("Reservasi tidak ditemukan","error");return;}
  if(state.reviews.some(r=>r.bookingId===bookingId)){toast("Reservasi ini sudah pernah diulas","error");return;}
  const comment=document.getElementById("rv-comment").value.trim();
  state.reviews.push({
    id:"r"+Date.now(),bookingId,guestId:b.guestId,barbermanId:b.barbermanId,
    rating:currentRating,comment:comment||null,createdAt:Date.now()
  });
  saveState();
  toast("Terima kasih atas ulasanmu! 🌟","success");
  closeModal();
  currentRating=0;
  // refresh lookup result if open
  doLookup();
  render();
}

            <button class="btn btn-ghost btn-icon" onclick="confirmDeleteBooking('${b.id}')">${I.trash}</button>
          </div>

function toggleBooking(id){
  const b=state.bookings.find(x=>x.id===id);
  if(!b) return;
  const next=b.status==="Confirmed"?"Canceled":"Confirmed";
  b.status=next;
  // sync barber status
  const barber=state.barbers.find(x=>x.id===b.barbermanId);
  if(barber){
    const stillBooked=state.bookings.some(x=>x.barbermanId===barber.id && x.status==="Confirmed");
    barber.status = (next==="Confirmed"||stillBooked) ? "Booked" : "Available";
  }
  saveState();
  toast(next==="Confirmed"?"Reservasi dikonfirmasi":"Reservasi dibatalkan","success");
  renderBookingsOnly();
  renderOverview && false; // skip full re-render
}
function confirmDeleteBooking(id){
  const b=state.bookings.find(x=>x.id===id);
  if(!b) return;
  openModal("confirmDelete",{kind:"booking",id,b});
}
function doDeleteBooking(id){
  const b=state.bookings.find(x=>x.id===id);
  if(!b) return;
  // delete reviews for this booking
  state.reviews=state.reviews.filter(r=>r.bookingId!==id);
  state.bookings=state.bookings.filter(x=>x.id!==id);
  // free barber
  const barber=state.barbers.find(x=>x.id===b.barbermanId);
  if(barber){
    const stillBooked=state.bookings.some(x=>x.barbermanId===barber.id && x.status==="Confirmed");
    barber.status=stillBooked?"Booked":"Available";
  }
  saveState();
  toast("Reservasi dihapus","success");
  closeModal();
  renderBookingsOnly();
}

function saveBookingDetail(id){
  const b=state.bookings.find(x=>x.id===id);
  if(!b) return;
  const schedule=document.getElementById("bd-schedule").value;
  const newBarberId=document.getElementById("bd-barber").value;
  const notes=document.getElementById("bd-notes").value.trim();
  const d=new Date(schedule);
  if(isNaN(d.getTime())){toast("Jadwal tidak valid","error");return;}
  const newBarber=state.barbers.find(x=>x.id===newBarberId);
  if(!newBarber){toast("Barberman tidak ditemukan","error");return;}
  const oldBarberId=b.barbermanId;
  b.schedule=d.getTime();
  b.notes=notes||null;
  if(newBarberId!==oldBarberId){
    b.barbermanId=newBarberId;
    b.totalCost=newBarber.price;
    // free old barber if no other confirmed bookings
    const oldBarber=state.barbers.find(x=>x.id===oldBarberId);
    if(oldBarber){
      const stillBooked=state.bookings.some(x=>x.id!==id && x.barbermanId===oldBarberId && x.status==="Confirmed");
      oldBarber.status=stillBooked?"Booked":"Available";
    }
    if(b.status==="Confirmed") newBarber.status="Booked";
  }
  saveState();
  toast("Reservasi diperbarui","success");
  closeModal();
  renderBookingsOnly();
}

/* ============ CSV EXPORT ============ */
function exportCSV(kind){
  let csv=""; let filename="";
  if(kind==="bookings"){
    filename=`reservasi-${new Date().toISOString().slice(0,10)}.csv`;
    csv="ID Reservasi,Nama Pelanggan,Email,Telepon,Barberman,Tipe,Jadwal,Status,Total Biaya (IDR),Catatan,Dibuat Pada\n";
    state.bookings.slice().sort((a,b)=>b.createdAt-a.createdAt).forEach(b=>{
      const g=state.guests.find(x=>x.id===b.guestId);
      const bar=state.barbers.find(x=>x.id===b.barbermanId);
      csv+=[b.reservationId,g?.name||"",g?.email||"",g?.phone||"",bar?.name||"",bar?.type||"",new Date(b.schedule).toISOString(),b.status,b.totalCost,(b.notes||"").replace(/"/g,'""'),new Date(b.createdAt).toISOString()].map(c=>`"${c}"`).join(",")+"\n";
    });
  } else {
    filename=`pelanggan-${new Date().toISOString().slice(0,10)}.csv`;
    csv="Nama,Email,Telepon,Total Reservasi,Reservasi Confirmed,Total Belanja (IDR),Terdaftar\n";
    state.guests.slice().sort((a,b)=>b.createdAt-a.createdAt).forEach(g=>{
      const bks=state.bookings.filter(b=>b.guestId===g.id);
      const conf=bks.filter(b=>b.status==="Confirmed");
      const total=conf.reduce((s,b)=>s+b.totalCost,0);
      csv+=[g.name,g.email,g.phone,bks.length,conf.length,total,new Date(g.createdAt).toISOString()].map(c=>`"${c}"`).join(",")+"\n";
    });
  }
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);
  toast("CSV diekspor: "+filename,"success");
}
